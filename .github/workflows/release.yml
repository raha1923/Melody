# Build installable sdist + wheel and attach them to a GitHub Release on tag push.
# Tag format: v0.2.0 (leading v is stripped for the package version check).
#
# Origin: if this repo is mirrored to GitHub, tags pushed there produce artifacts.
# Origin-native release file attach may be limited — use this workflow (or
# scripts/build-release.sh locally) and upload the wheel to whatever release UI
# your forge provides.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$TAG package=$PKG"
          test "$TAG" = "$PKG"

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
