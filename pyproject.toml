[project]
name = "melodify"
version = "0.3.0"
description = "Terminal (TUI) music client for Melodify on Ubuntu and macOS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "textual>=0.80",
]

[project.urls]
# Replace OWNER/REPO after the public GitHub (or Origin) repository exists.
Homepage = "https://github.com/OWNER/REPO"
Issues = "https://github.com/OWNER/REPO/issues"
ReleaseNotes = "https://github.com/OWNER/REPO/blob/main/docs/RELEASE_NOTES.md"

[project.optional-dependencies]
# Pure-Python MPRIS helpers only. Do NOT list mpris-server / PyGObject here —
# pip would try to compile cairo. On Ubuntu:
#   apt install python3-gi gir1.2-glib-2.0
#   pip install -e ".[mpris]"
#   pip install --no-deps mpris-server
mpris = [
  "StrEnum>=0.4.15",
  "emoji>=2.8.0,<3",
  "pydbus>=0.6.0,<0.7",
  "unidecode>=1.3.7,<2",
]
# macOS Control Center / media keys (Now Playing)
macos = [
  "pyobjc-framework-MediaPlayer>=10.0",
]
dev = [
  "pytest>=8.0",
  "build>=1.0",
]

[project.scripts]
melodify = "melodify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
