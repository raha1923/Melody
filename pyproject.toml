[project]
name = "melodify"
version = "0.1.0"
description = "Ubuntu terminal (TUI) music client for Melodify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "textual>=0.80",
  "mpris-server>=0.9.0",
]

[project.scripts]
melodify = "melodify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
