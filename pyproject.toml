[project]
name = "melodify"
version = "0.1.0"
description = "Ubuntu terminal (TUI) music client for Melodify"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "textual>=0.80",
]

[project.optional-dependencies]
# Pure-Python MPRIS helpers only. Do NOT list mpris-server / PyGObject here —
# pip would try to compile cairo. On Ubuntu:
#   apt install python3-gi gir1.2-glib-2.0
#   pip install -e ".[mpris]"
#   pip install --no-deps mpris-server
mpris = [
  "StrEnum>=0.4.15",
  "emoji>=2.8.0,<3",
  "pydbus>=0.6.0,<0.7",
  "unidecode>=1.3.7,<2",
]

[project.scripts]
melodify = "melodify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
